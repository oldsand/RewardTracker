<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="消費小助手">
    
    <title>新城消費券小助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #f8fafc;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #f8fafc;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            transform: translateX(100%);
            opacity: 0;
            z-index: 10;
            pointer-events: none;
        }
        .screen.active {
            transform: translateX(0);
            opacity: 1;
            z-index: 20;
            pointer-events: auto;
        }
        .screen.main-screen { transform: translateX(-20%); }
        .screen.main-screen.active { transform: translateX(0); }
        .scrollable-content {
            flex: 1; overflow-y: auto; padding: 1rem; overflow-x: hidden;
        }
        
        /* Dashboard Carousel Styling */
        .carousel-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            border-radius: 1rem;
            margin-bottom: 1rem;
            touch-action: pan-y pinch-zoom;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }
        .carousel-slide {
            flex: 0 0 100%;
            width: 100%;
            padding: 0 0.25rem;
            box-sizing: border-box;
        }
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #cbd5e1;
            transition: all 0.3s;
        }
        .carousel-dot.active {
            background-color: #3b82f6;
            width: 16px;
            border-radius: 4px;
        }

        /* Swipe Actions Styling */
        .swipe-item-container {
            position: relative; overflow: hidden; border-radius: 0.75rem; margin-bottom: 0.75rem; background-color: #f1f5f9;
        }
        .swipe-actions {
            position: absolute; top: 0; bottom: 0; right: 0; display: flex; z-index: 1;
        }
        .swipe-action-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 0.875rem; width: 70px;
        }
        .swipe-content {
            position: relative; z-index: 2; width: 100%; background-color: white; transition: transform 0.25s ease-out; will-change: transform; border-radius: 0.75rem; padding: 1rem; min-height: 76px; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .swipe-content.swiping { transition: none; }
        
        /* Status Styling */
        .status-used, .status-expired { background-color: #f1f5f9 !important; }
        .status-used .amt-text, .status-expired .amt-text, .status-expired .platform-text, .status-used .platform-text { color: #94a3b8 !important; }
        
        /* Highlights */
        .suggested-highlight { border: 3px solid #ef4444 !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4) !important; transform: scale(1.02); transition: all 0.3s ease; z-index: 10; position: relative; }
        .view-selected-highlight { border: 3px solid #10b981 !important; background-color: #ecfdf5 !important; }

        /* Color Input */
        input[type="color"] { -webkit-appearance: none; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; padding: 0; overflow: hidden; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #e2e8f0; border-radius: 50%; }
        
        /* Modals */
        .modal-active { opacity: 1 !important; pointer-events: auto !important; }
        .modal-box-active { transform: scale(1) !important; }

        /* Multiplier Badge */
        .multiplier-badge {
            position: absolute; top: -10px; right: -10px; background-color: #ef4444; color: white; font-weight: 900; font-size: 0.875rem; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- Screen: Main -->
        <div id="screen-main" class="screen main-screen active bg-white">
            <div class="p-3 flex justify-between items-center shrink-0 border-b border-gray-50 pb-2">
                <button onclick="promptInstall()" class="p-2 text-gray-400 hover:text-blue-600 active:bg-gray-100 rounded-full transition-colors">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">消費獎賞小助手</h1>
                <button onclick="navTo('screen-settings')" class="p-2 text-gray-400 hover:text-gray-800 active:bg-gray-100 rounded-full transition-colors">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
            
            <div class="flex-1 flex flex-col justify-center px-5 py-2">
                <div class="carousel-container" id="dashboard-carousel" ontouchstart="handleCarouselTouchStart(event)" ontouchmove="handleCarouselTouchMove(event)" ontouchend="handleCarouselTouchEnd(event)">
                    <div class="carousel-track" id="dashboard-track">
                        <!-- Slides injected here -->
                    </div>
                </div>
                <div class="carousel-dots mb-6" id="dashboard-dots"></div>

                <div class="w-full space-y-4">
                    <button onclick="navTo('screen-view')" class="w-full py-4 bg-blue-500 text-white rounded-2xl text-xl font-bold shadow-lg shadow-blue-500/30 active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        查看紀錄
                    </button>
                    <button onclick="navTo('screen-add')" class="w-full py-4 bg-emerald-500 text-white rounded-2xl text-xl font-bold shadow-lg shadow-emerald-500/30 active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        獲取消費券
                    </button>
                    <button onclick="navTo('screen-use')" class="w-full py-4 bg-amber-500 text-white rounded-2xl text-xl font-bold shadow-lg shadow-amber-500/30 active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                        使用消費券
                    </button>
                </div>
            </div>

            <!-- Clear Button -->
            <div class="p-4 flex justify-start shrink-0">
                <button onclick="promptClearVouchers()" class="px-4 py-2 text-red-500 font-semibold flex items-center space-x-2 active:bg-red-50 rounded-xl transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    <span class="text-sm">清除紀錄</span>
                </button>
            </div>
        </div>

        <!-- Screen: Settings -->
        <div id="screen-settings" class="screen flex flex-col h-full bg-gray-50">
            <div class="bg-white px-4 py-4 shadow-sm flex items-center border-b border-gray-100 shrink-0 relative z-20">
                <button onclick="navTo('screen-main')" class="p-2 -ml-2 text-gray-600 active:bg-gray-100 rounded-full">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <h2 class="text-xl font-bold text-gray-800 ml-2">系統設定</h2>
            </div>
            
            <div class="p-4 shrink-0 bg-white shadow-sm z-10 border-b border-gray-200">
                <h3 class="text-sm font-semibold text-gray-500 mb-2">新增銀行 / 平台</h3>
                <div class="flex gap-2 items-center">
                    <input type="color" id="new-platform-color" value="#3b82f6" class="shrink-0">
                    <input type="text" id="new-platform-input" placeholder="例如：大豐銀行" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-3 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                    <button onclick="addPlatform()" class="bg-blue-500 text-white px-5 py-3 rounded-xl font-bold active:bg-blue-600 transition-colors shrink-0 shadow-sm">新增</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 pb-20">
                <h3 class="text-sm font-semibold text-gray-500 mb-3 ml-1">現有平台清單</h3>
                <ul id="platform-list" class="space-y-2">
                    <!-- Platforms injected here -->
                </ul>
            </div>
        </div>

        <!-- Screen: Get -->
        <div id="screen-add" class="screen">
            <div class="bg-emerald-500 px-4 py-4 shadow-sm flex justify-between items-center text-white shrink-0 z-20">
                <div class="flex items-center">
                    <button onclick="navTo('screen-main')" class="p-2 -ml-2 active:bg-emerald-600 rounded-full transition-colors">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                    </button>
                    <h2 class="text-xl font-bold ml-2">獲取消費券</h2>
                </div>
                <button onclick="promptNewRound()" class="px-3 py-1.5 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-bold active:scale-95 transition-all shadow-sm">
                    新一輪
                </button>
            </div>
            
            <div class="bg-emerald-50/80 p-2 text-center border-b border-emerald-100 shrink-0">
                <p id="current-round-label-display" class="text-xs text-emerald-800 font-bold">當前週期：載入中...</p>
            </div>

            <div class="scrollable-content flex flex-col gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 border-t-4 border-t-emerald-500">
                    <div class="mb-5">
                        <label class="block text-gray-700 font-bold mb-2 text-sm">選擇平台 <span class="font-normal text-gray-400">(每輪每間限3張)</span></label>
                        <select id="acquire-platform" onchange="resetAmountSelection()" class="w-full bg-gray-50 border border-gray-200 text-gray-800 py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-lg font-bold appearance-none shadow-inner">
                            <!-- Options injected here -->
                        </select>
                    </div>
                    <div class="mb-6 relative">
                        <div class="flex justify-between items-center mb-3">
                            <label class="text-gray-700 font-bold text-sm">點擊金額 <span class="font-normal text-gray-400">(可混搭多張)</span></label>
                            <button onclick="resetAmountSelection()" class="text-xs text-red-500 font-bold bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg active:scale-95 transition-transform">
                                重置選擇
                            </button>
                        </div>
                        <div class="grid grid-cols-3 gap-3" id="amount-buttons-container">
                            <!-- Amount Buttons generated here by JS -->
                        </div>
                    </div>
                    <button onclick="addVouchersBatch()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl text-xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-transform flex justify-center items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        確認新增
                    </button>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm mt-1 border border-gray-100">
                    <h3 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">剛剛新增紀錄</h3>
                    <div id="session-added-list" class="space-y-2">
                        <!-- Session added vouchers injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Screen: View -->
        <div id="screen-view" class="screen">
            <div class="bg-blue-500 px-4 py-4 shadow-sm flex items-center justify-between text-white shrink-0 z-20">
                <div class="flex items-center">
                    <button onclick="navTo('screen-main')" class="p-2 -ml-2 active:bg-blue-600 rounded-full transition-colors">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                    </button>
                    <h2 class="text-xl font-bold ml-2">查看紀錄</h2>
                </div>
                <button onclick="calculateSelectedViewVouchers()" class="p-2 bg-white/20 hover:bg-white/30 rounded-full transition-colors active:scale-95 shadow-sm relative group">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75V21m-7.5-5.25h7.5m-7.5-6h7.5m-12 18.75h16.5a2.25 2.25 0 002.25-2.25V5.25A2.25 2.25 0 0019.5 3H4.5A2.25 2.25 0 002.25 5.25v13.5A2.25 2.25 0 004.5 21z" /></svg>
                </button>
            </div>
            
            <div class="bg-white p-3 shadow-sm flex justify-between text-center border-b border-gray-100 z-10 relative shrink-0">
                <div class="flex-1">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">總共抽到</p>
                    <p id="stat-total" class="text-lg font-black text-gray-800">0</p>
                </div>
                <div class="flex-1 border-l border-r border-gray-100">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">已經使用</p>
                    <p id="stat-used" class="text-lg font-black text-amber-500">0</p>
                </div>
                <div class="flex-1">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">未用淨低</p>
                    <p id="stat-remain" class="text-lg font-black text-emerald-500">0</p>
                </div>
            </div>
            
            <div class="p-2 bg-blue-50 flex justify-center items-center shrink-0 border-b border-blue-100 shadow-inner">
                <p class="text-xs text-blue-700 font-bold flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    點未用券計算；向左滑動操作
                </p>
            </div>

            <div class="scrollable-content pt-3 pb-24 bg-gray-50/50">
                <div id="all-vouchers-list" class="space-y-0">
                    <!-- All vouchers injected here -->
                </div>
            </div>
        </div>

        <!-- Screen: Use -->
        <div id="screen-use" class="screen">
            <div class="bg-amber-500 px-4 py-4 shadow-sm flex justify-between items-center text-white shrink-0 z-20">
                <div class="flex items-center">
                    <button onclick="navTo('screen-main')" class="p-2 -ml-2 active:bg-amber-600 rounded-full transition-colors">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                    </button>
                    <h2 class="text-xl font-bold ml-2">使用消費券</h2>
                </div>
                <button onclick="openCalcModal()" class="p-2 bg-white/20 hover:bg-white/30 rounded-full transition-colors active:scale-95 shadow-sm">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75V21m-7.5-5.25h7.5m-7.5-6h7.5m-12 18.75h16.5a2.25 2.25 0 002.25-2.25V5.25A2.25 2.25 0 0019.5 3H4.5A2.25 2.25 0 002.25 5.25v13.5A2.25 2.25 0 004.5 21z" /></svg>
                </button>
            </div>
            
            <div class="p-3 bg-white border-b border-gray-100 shrink-0 shadow-sm relative z-10 flex flex-col gap-2">
                <div class="flex items-center gap-2 bg-gray-50 p-1 rounded-xl border border-gray-200">
                    <span class="text-xs font-bold text-gray-500 w-12 text-center">銀行</span>
                    <select id="use-bank-filter" onchange="renderUnusedVouchers()" class="flex-1 bg-transparent text-gray-700 py-1.5 px-2 focus:outline-none text-sm font-bold appearance-none">
                        <option value="all">全部銀行</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 bg-gray-50 p-1 rounded-xl border border-gray-200">
                    <span class="text-xs font-bold text-gray-500 w-12 text-center">排序</span>
                    <select id="use-sort-filter" onchange="renderUnusedVouchers()" class="flex-1 bg-transparent text-gray-700 py-1.5 px-2 focus:outline-none text-sm font-bold appearance-none">
                        <option value="default">預設獲取順序</option>
                        <option value="amount">金額由大至小</option>
                        <option value="amountAsc">金額由小至大</option>
                    </select>
                </div>
            </div>
            
            <div class="scrollable-content pt-4 pb-24 bg-gray-50/50">
                <div id="unused-vouchers-list" class="space-y-3">
                    <!-- Unused vouchers injected here -->
                </div>
            </div>
        </div>

        <!-- Universal Modal -->
        <div id="universal-modal" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200" style="z-index: 100;">
            <div class="bg-white w-[85%] rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-200 border border-gray-100" id="universal-modal-box">
                <div class="flex justify-center mb-5" id="modal-icon-container"></div>
                <h3 class="text-xl font-bold text-center text-gray-800 mb-2" id="modal-title">確認？</h3>
                <p class="text-center text-gray-500 mb-6 text-sm font-medium leading-relaxed" id="modal-desc">說明內容</p>
                <div class="flex space-x-3">
                    <button onclick="closeModal()" class="flex-1 py-3.5 bg-gray-100 text-gray-600 font-bold rounded-xl active:bg-gray-200 transition-colors">
                        取消
                    </button>
                    <button id="modal-confirm-btn" onclick="confirmModal()" class="flex-1 py-3.5 bg-blue-500 text-white font-bold rounded-xl active:bg-blue-600 transition-colors shadow-lg">
                        確定
                    </button>
                </div>
            </div>
        </div>

        <!-- Calculator Modal (Use Screen) -->
        <div id="calc-modal" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200" style="z-index: 110;">
            <div class="bg-white w-[90%] rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-200 border border-gray-100" id="calc-modal-box">
                <div class="flex justify-between items-center mb-5 border-b border-gray-100 pb-4">
                    <h3 class="text-xl font-black text-gray-800 flex items-center tracking-tight">
                        <svg class="h-6 w-6 mr-2 text-red-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75V21m-7.5-5.25h7.5m-7.5-6h7.5m-12 18.75h16.5a2.25 2.25 0 002.25-2.25V5.25A2.25 2.25 0 0019.5 3H4.5A2.25 2.25 0 002.25 5.25v13.5A2.25 2.25 0 004.5 21z" /></svg>
                        智能計算機
                    </h3>
                    <button onclick="closeCalcModal()" class="p-2 text-gray-400 hover:text-gray-600 rounded-full bg-gray-50 active:bg-gray-200">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-600 font-bold mb-3 text-sm text-center">預計消費總金額 (MOP)</label>
                    <input type="number" id="calc-input" placeholder="例如: 150" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-4 text-3xl text-center font-black focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 shadow-inner text-gray-800">
                </div>

                <div class="mt-6">
                    <button onclick="calculateAndHighlight()" class="w-full py-4 bg-red-500 text-white font-black rounded-xl active:bg-red-600 transition-colors shadow-lg shadow-red-500/40 text-lg tracking-wider flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        搵最抵組合！
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Toast Notification -->
        <div id="toast" class="absolute top-12 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl font-bold transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none text-center min-w-[200px] text-sm z-[200]">
            Notification
        </div>

    </div>

    <script>
        const defaultPlatformData = [
            { name: "中銀", color: "#e31837" }, 
            { name: "工銀", color: "#c60000" }, 
            { name: "MPay", color: "#f58220" }, 
            { name: "支付寶", color: "#00a3fe" }, 
            { name: "豐付寶", color: "#FFC107" }  
        ];
        const amountTypes = [10, 20, 50, 100, 200];
        
        let state = { platforms: [], vouchers: [], sessionAdded: [], settings: { roundStartDay: 5 } };
        let modalConfirmCallback = null;
        let deferredPrompt = null;
        
        // Multi-Selection State for "Get" Screen
        let selectedAmounts = { 10: 0, 20: 0, 50: 0, 100: 0, 200: 0 };

        // Swipe Delete State
        let swipeState = { startX: 0, activeElement: null, actionWidth: 0, isSwiping: false, openItemId: null };
        let isSwipingMotion = false;
        let viewSelectedIds = new Set();

        // Carousel State
        let carouselIdx = 0;
        let carouselMax = 0;
        let cStartX = 0;
        let cCurrentX = 0;
        let cIsSwiping = false;

        // PWA Setup (Single File Hack)
        const manifestData = {
            "name": "消費獎賞小助手", "short_name": "消費小助手", "start_url": ".", "display": "standalone", "background_color": "#ffffff", "theme_color": "#3b82f6",
            "icons": [{"src": "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233b82f6'/%3E%3Ctext x='50' y='68' font-size='50' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3E%24%3C/text%3E%3C/svg%3E", "sizes": "192x192", "type": "image/svg+xml"}]
        };
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(new Blob([JSON.stringify(manifestData)], {type: 'application/json'}));
        document.head.appendChild(manifestLink);

        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

        function initData() {
            const savedPlatforms = localStorage.getItem('macau_platforms');
            if (savedPlatforms) {
                try {
                    let parsed = JSON.parse(savedPlatforms);
                    if (parsed.length > 0 && typeof parsed[0] === 'string') {
                        state.platforms = parsed.map(name => {
                            const found = defaultPlatformData.find(d => d.name === name);
                            return { name: name, color: found ? found.color : '#3b82f6' };
                        });
                    } else { state.platforms = parsed; }
                } catch(e) { state.platforms = JSON.parse(JSON.stringify(defaultPlatformData)); }
            } else { state.platforms = JSON.parse(JSON.stringify(defaultPlatformData)); }

            const savedVouchers = localStorage.getItem('macau_vouchers');
            if (savedVouchers) state.vouchers = JSON.parse(savedVouchers);
            
            saveData();
            buildDashboardCarousel();
        }

        function saveData() {
            localStorage.setItem('macau_platforms', JSON.stringify(state.platforms));
            localStorage.setItem('macau_vouchers', JSON.stringify(state.vouchers));
        }

        function getPlatformColor(name) {
            const p = state.platforms.find(x => x.name === name);
            return p ? p.color : '#cbd5e1';
        }

        function getCurrentRoundRange() {
            const now = new Date(); now.setHours(0, 0, 0, 0);
            const currentDay = now.getDay();
            const startDay = parseInt(state.settings.roundStartDay) || 5; 
            let diff = currentDay >= startDay ? currentDay - startDay : currentDay + 7 - startDay;
            const startDate = new Date(now); startDate.setDate(now.getDate() - diff);
            const endDate = new Date(startDate); endDate.setDate(startDate.getDate() + 6);
            return `${startDate.getFullYear()}-${String(startDate.getMonth()+1).padStart(2, '0')}-${String(startDate.getDate()).padStart(2, '0')} 至 ${endDate.getFullYear()}-${String(endDate.getMonth()+1).padStart(2, '0')}-${String(endDate.getDate()).padStart(2, '0')}`;
        }

        function showToast(msg, type="success") {
            const toast = document.getElementById('toast');
            toast.className = `absolute top-12 left-1/2 transform -translate-x-1/2 ${type === 'error' ? 'bg-red-500' : 'bg-slate-800'} text-white px-6 py-3 rounded-full shadow-2xl font-bold transition-all duration-300 pointer-events-none text-center min-w-[200px] text-sm z-[200]`;
            toast.textContent = msg;
            requestAnimationFrame(() => { toast.classList.remove('opacity-0', '-translate-y-4'); toast.classList.add('opacity-100', 'translate-y-0'); });
            setTimeout(() => { toast.classList.remove('opacity-100', 'translate-y-0'); toast.classList.add('opacity-0', '-translate-y-4'); }, 2500);
        }

        function openModal({ title, desc, iconType, confirmBtnText, confirmBtnClass, onConfirm }) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-desc').innerHTML = desc;
            const btn = document.getElementById('modal-confirm-btn');
            btn.textContent = confirmBtnText;
            btn.className = `flex-1 py-3.5 text-white font-bold rounded-xl transition-colors shadow-lg ${confirmBtnClass}`;
            
            const iconContainer = document.getElementById('modal-icon-container');
            if (iconType === 'danger') iconContainer.innerHTML = `<div class="bg-red-50 p-4 rounded-full text-red-500"><svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg></div>`;
            else if (iconType === 'warning') iconContainer.innerHTML = `<div class="bg-amber-50 p-4 rounded-full text-amber-500"><svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg></div>`;
            else iconContainer.innerHTML = `<div class="bg-blue-50 p-4 rounded-full text-blue-500"><svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" /></svg></div>`;

            modalConfirmCallback = onConfirm;
            const modal = document.getElementById('universal-modal');
            const modalBox = document.getElementById('universal-modal-box');
            modal.classList.add('modal-active');
            modalBox.classList.add('modal-box-active');
        }

        function closeModal() {
            document.getElementById('universal-modal').classList.remove('modal-active');
            document.getElementById('universal-modal-box').classList.remove('modal-box-active');
            modalConfirmCallback = null;
        }
        function confirmModal() { if (modalConfirmCallback) modalConfirmCallback(); closeModal(); }

        function promptInstall() {
            if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; } 
            else { openModal({ title: "加入主畫面", desc: "請點擊瀏覽器分享圖示<br/>選擇「加入主畫面」以當作 App 使用！", iconType: "info", confirmBtnText: "明白", confirmBtnClass: "bg-blue-500", onConfirm: ()=>{} }); }
        }

        function promptClearVouchers() {
            openModal({
                title: "確認清除？", desc: "這將會永久刪除所有獲取及使用紀錄，但會保留你設定嘅銀行清單。",
                iconType: "danger", confirmBtnText: "確認清除", confirmBtnClass: "bg-red-500",
                onConfirm: () => { state.vouchers = []; state.sessionAdded = []; saveData(); buildDashboardCarousel(); showToast("紀錄已清空", "success"); }
            });
        }

        function navTo(screenId) {
            resetSwipe(); viewSelectedIds.clear(); document.querySelectorAll('.suggested-highlight').forEach(el => el.classList.remove('suggested-highlight'));
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            if (screenId === 'screen-main') buildDashboardCarousel();
            if (screenId === 'screen-settings') renderPlatforms();
            if (screenId === 'screen-add') {
                state.sessionAdded = []; populatePlatformSelect(); renderSessionAdded();
                document.getElementById('current-round-label-display').textContent = `當前週期：${getCurrentRoundRange()}`;
                resetAmountSelection();
            }
            if (screenId === 'screen-view') renderViewList();
            if (screenId === 'screen-use') { populateUseBankFilter(); renderUnusedVouchers(); }
        }

        function buildDashboardCarousel() {
            const track = document.getElementById('dashboard-track');
            const unused = state.vouchers.filter(v => v.status === 'unused');
            
            // Total Page
            const total = unused.reduce((s, v) => s + v.amount, 0);
            const counts = {}; unused.forEach(v => counts[v.amount] = (counts[v.amount] || 0) + 1);
            let totalBreakdown = Object.keys(counts).length ? Object.keys(counts).map(Number).sort((a,b)=>a-b).map(amt => `<span class="bg-white/80 px-2 py-1 rounded-lg text-xs font-bold text-gray-700 shadow-sm">$${amt} <span class="text-blue-600">x${counts[amt]}</span></span>`).join('') : '<span class="text-xs text-gray-400 font-bold">暫無未用消費券</span>';

            let slidesHTML = `
                <div class="carousel-slide">
                    <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-5 rounded-2xl border border-blue-200 shadow-sm h-full flex flex-col justify-between">
                        <p class="text-xs font-bold text-blue-800 uppercase tracking-widest mb-1">全部剩餘總額</p>
                        <p class="text-4xl font-black text-blue-600 mb-3 drop-shadow-sm">$${total}</p>
                        <div class="flex flex-wrap gap-1.5">${totalBreakdown}</div>
                    </div>
                </div>
            `;

            // Bank Pages
            const bankMap = {};
            unused.forEach(v => {
                if(!bankMap[v.platform]) bankMap[v.platform] = { total: 0, counts: {} };
                bankMap[v.platform].total += v.amount;
                bankMap[v.platform].counts[v.amount] = (bankMap[v.platform].counts[v.amount] || 0) + 1;
            });

            const activeBanks = Object.keys(bankMap);
            activeBanks.forEach(bank => {
                const bData = bankMap[bank];
                const color = getPlatformColor(bank);
                const bkDown = Object.keys(bData.counts).map(Number).sort((a,b)=>a-b).map(amt => `<span class="bg-white/80 px-2 py-1 rounded-lg text-xs font-bold text-gray-700 shadow-sm">$${amt} <span style="color:${color}">x${bData.counts[amt]}</span></span>`).join('');
                slidesHTML += `
                <div class="carousel-slide">
                    <div class="bg-white p-5 rounded-2xl border-l-[6px] shadow-sm h-full flex flex-col justify-between" style="border-left-color: ${color}; border-top: 1px solid #f1f5f9; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9;">
                        <p class="text-xs font-bold uppercase tracking-widest mb-1" style="color:${color}">${bank} 剩餘</p>
                        <p class="text-4xl font-black mb-3 drop-shadow-sm text-gray-800">$${bData.total}</p>
                        <div class="flex flex-wrap gap-1.5">${bkDown}</div>
                    </div>
                </div>`;
            });

            track.innerHTML = slidesHTML;
            carouselMax = activeBanks.length; // total pages = 1 + activeBanks.length
            carouselIdx = 0;
            updateCarouselPosition(0);
            renderCarouselDots();
        }

        function renderCarouselDots() {
            const dots = document.getElementById('dashboard-dots');
            let h = '';
            for(let i=0; i<=carouselMax; i++) h += `<div class="carousel-dot ${i===carouselIdx?'active':''}"></div>`;
            dots.innerHTML = h;
        }

        function updateCarouselPosition(offset = 0) {
            const track = document.getElementById('dashboard-track');
            track.style.transition = offset === 0 ? 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
            track.style.transform = `translateX(calc(-${carouselIdx * 100}% + ${offset}px))`;
        }

        function handleCarouselTouchStart(e) {
            cStartX = e.touches[0].clientX;
            cIsSwiping = true;
        }
        function handleCarouselTouchMove(e) {
            if(!cIsSwiping) return;
            cCurrentX = e.touches[0].clientX;
            const diff = cCurrentX - cStartX;
            updateCarouselPosition(diff);
        }
        function handleCarouselTouchEnd(e) {
            if(!cIsSwiping) return;
            cIsSwiping = false;
            const diff = cCurrentX - cStartX;
            if(Math.abs(diff) > 50) {
                if(diff > 0) carouselIdx = carouselIdx > 0 ? carouselIdx - 1 : carouselMax; // loop prev
                else carouselIdx = carouselIdx < carouselMax ? carouselIdx + 1 : 0; // loop next
            }
            updateCarouselPosition(0);
            renderCarouselDots();
        }

        function renderPlatforms() {
            const list = document.getElementById('platform-list');
            list.innerHTML = state.platforms.map((p, i) => `
                <li class="p-3 bg-white border border-gray-100 rounded-xl flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-3">
                        <input type="color" value="${p.color}" onchange="updatePlatformColor(${i}, this.value)" class="focus:outline-none shadow-sm">
                        <span class="font-bold text-gray-700 text-lg">${p.name}</span>
                    </div>
                    <button onclick="deletePlatform(${i})" class="p-2 text-red-400 hover:text-red-600 rounded-full bg-red-50 active:bg-red-100">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                </li>`).join('');
        }
        function addPlatform() {
            const val = document.getElementById('new-platform-input').value.trim();
            const color = document.getElementById('new-platform-color').value;
            if (val && !state.platforms.find(p => p.name === val)) {
                state.platforms.push({ name: val, color }); saveData(); renderPlatforms();
                document.getElementById('new-platform-input').value = ''; showToast(`已新增 ${val}`);
            } else if (val) showToast("銀行已存在", "error");
        }
        function updatePlatformColor(i, c) { state.platforms[i].color = c; saveData(); }
        function deletePlatform(i) { state.platforms.splice(i, 1); saveData(); renderPlatforms(); }

        function populatePlatformSelect() {
            document.getElementById('acquire-platform').innerHTML = state.platforms.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
        }
        
        function getRemainingAllowance(platform) {
            const currentRound = getCurrentRoundRange();
            // Count all vouchers from this platform in the current round (regardless of used/unused/expired status)
            const countInRound = state.vouchers.filter(v => v.platform === platform && v.roundLabel === currentRound).length;
            return Math.max(0, 3 - countInRound);
        }

        function resetAmountSelection() {
            selectedAmounts = { 10: 0, 20: 0, 50: 0, 100: 0, 200: 0 };
            renderAmountButtons();
        }

        function handleAmountClick(amt) {
            const platform = document.getElementById('acquire-platform').value;
            if(!platform) return;
            
            const maxAllowed = getRemainingAllowance(platform);
            const currentSelectedCount = Object.values(selectedAmounts).reduce((a, b) => a + b, 0);
            
            if (currentSelectedCount < maxAllowed) {
                selectedAmounts[amt]++;
                renderAmountButtons();
            } else {
                showToast(`今期 ${platform} 最多只可抽 3 張（淨低配額：${maxAllowed}）！`, "error");
            }
        }

        function renderAmountButtons() {
            const container = document.getElementById('amount-buttons-container');
            container.innerHTML = amountTypes.map(amt => {
                const count = selectedAmounts[amt];
                const isActive = count > 0;
                const badge = isActive ? `<div class="multiplier-badge">x${count}</div>` : '';
                const btnClass = isActive ? 'bg-emerald-500 text-white border-emerald-500 shadow-md scale-95' : 'bg-white text-gray-600 border-gray-200';
                return `
                <div class="relative">
                    <button onclick="handleAmountClick(${amt})" class="w-full py-4 border-2 rounded-xl font-black text-xl transition-all duration-200 active:scale-95 ${btnClass}">
                        $${amt}
                    </button>
                    ${badge}
                </div>`;
            }).join('');
        }

        function addVouchersBatch() {
            const platformName = document.getElementById('acquire-platform').value;
            const totalCount = Object.values(selectedAmounts).reduce((a, b) => a + b, 0);
            
            if (!platformName || totalCount === 0) { 
                showToast("請點擊選擇金額！", "error"); 
                return; 
            }
            
            const currentRound = getCurrentRoundRange();
            
            amountTypes.forEach(amt => {
                const count = selectedAmounts[amt];
                for(let i=0; i < count; i++) {
                    const newVoucher = { id: 'v_' + Math.random().toString(36).substr(2, 9), platform: platformName, amount: amt, status: 'unused', roundLabel: currentRound, date: new Date().toISOString() };
                    state.vouchers.push(newVoucher);
                    state.sessionAdded.unshift(newVoucher);
                }
            });
            
            saveData(); 
            renderSessionAdded(); 
            resetAmountSelection(); 
            showToast(`成功新增 ${totalCount} 張！`, "success");
        }

        function renderSessionAdded() {
            const list = document.getElementById('session-added-list');
            if (!state.sessionAdded.length) { list.innerHTML = '<p class="text-gray-400 text-sm text-center py-2 font-medium">尚未新增</p>'; return; }
            list.innerHTML = state.sessionAdded.map(v => `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100" style="border-left: 5px solid ${getPlatformColor(v.platform)}">
                    <span class="font-bold text-gray-800">${v.platform} <span class="text-[10px] text-gray-400 ml-1 bg-white px-1.5 py-0.5 rounded shadow-sm">${v.roundLabel}</span></span>
                    <span class="font-black text-emerald-600">$${v.amount}</span>
                </div>`).join('');
        }

        function promptNewRound() {
            if (!state.vouchers.some(v => v.status === 'unused')) { showToast("當前無未用消費券，可直接繼續"); return; }
            openModal({
                title: "確認開啟新一輪？", desc: "所有未用嘅消費券會變成「💸 失效」。", iconType: "warning", confirmBtnText: "確認", confirmBtnClass: "bg-amber-500",
                onConfirm: () => { state.vouchers.forEach(v => { if (v.status === 'unused') v.status = 'expired'; }); saveData(); showToast("新一輪開始！"); }
            });
        }

        function handleTouchStart(e, id) {
            isSwipingMotion = false;
            if (swipeState.openItemId && swipeState.openItemId !== id) resetSwipe();
            swipeState.startX = e.touches[0].clientX; 
            swipeState.activeElement = e.currentTarget;
            swipeState.isSwiping = true; 
            swipeState.activeElement.classList.add('swiping');
            swipeState.actionWidth = swipeState.activeElement.previousElementSibling ? swipeState.activeElement.previousElementSibling.offsetWidth : 0;
        }
        function handleTouchMove(e) {
            if (!swipeState.isSwiping || !swipeState.activeElement) return;
            const deltaX = e.touches[0].clientX - swipeState.startX;
            if (Math.abs(deltaX) > 10) isSwipingMotion = true;
            let translateX = swipeState.openItemId === swipeState.activeElement.dataset.id ? 
                Math.max(-swipeState.actionWidth, Math.min(0, -swipeState.actionWidth + deltaX)) : Math.max(-swipeState.actionWidth, Math.min(0, deltaX));
            if (Math.abs(deltaX) > 10 && e.cancelable) e.preventDefault(); 
            swipeState.activeElement.style.transform = `translateX(${translateX}px)`;
        }
        function handleTouchEnd(e) {
            if (!swipeState.isSwiping || !swipeState.activeElement) return;
            swipeState.isSwiping = false; const el = swipeState.activeElement; el.classList.remove('swiping');
            const currentTranslateX = new DOMMatrixReadOnly(window.getComputedStyle(el).transform).m41;
            if (currentTranslateX < -swipeState.actionWidth / 2) { el.style.transform = `translateX(-${swipeState.actionWidth}px)`; swipeState.openItemId = el.dataset.id; } 
            else { el.style.transform = `translateX(0px)`; swipeState.openItemId = null; }
            swipeState.activeElement = null;
        }
        function resetSwipe() {
            if (swipeState.openItemId) { const el = document.querySelector(`.swipe-content[data-id="${swipeState.openItemId}"]`); if (el) el.style.transform = `translateX(0px)`; swipeState.openItemId = null; }
        }

        function handleViewItemTap(id) {
            if (isSwipingMotion) return;
            if (swipeState.openItemId) { resetSwipe(); return; }
            const v = state.vouchers.find(x => x.id === id);
            if (v && v.status === 'unused') {
                viewSelectedIds.has(id) ? viewSelectedIds.delete(id) : viewSelectedIds.add(id);
                renderViewList();
            }
        }

        function promptDelete(id) {
            openModal({ title: "確認刪除？", desc: "紀錄將永久刪除。", iconType: "danger", confirmBtnText: "刪除", confirmBtnClass: "bg-red-500", onConfirm: () => { state.vouchers = state.vouchers.filter(v => v.id !== id); saveData(); renderViewList(); showToast("已刪除"); } });
        }
        function promptUnuse(id) {
            openModal({ title: "取消使用？", desc: "變為未使用狀態。", iconType: "warning", confirmBtnText: "取消", confirmBtnClass: "bg-amber-500", onConfirm: () => { const v = state.vouchers.find(v => v.id === id); if(v) v.status = 'unused'; saveData(); renderViewList(); showToast("已還原"); } });
        }

        function calculateSelectedViewVouchers() {
            if (!viewSelectedIds.size) { showToast("請先點選未用嘅消費券！", "error"); return; }
            let sum = [...viewSelectedIds].reduce((s, id) => s + (state.vouchers.find(v=>v.id===id)?.amount||0), 0);
            openModal({ title: "反向計算", desc: `為咗用齊呢 ${viewSelectedIds.size} 張（共 $${sum}），<br/><br/><span class="text-2xl font-black text-emerald-600">需消費至少 $${sum * 3}</span>`, iconType: "info", confirmBtnText: "明白", confirmBtnClass: "bg-blue-500", onConfirm: () => { viewSelectedIds.clear(); renderViewList(); } });
        }

        function renderViewList() {
            let total = 0, usedAmt = 0;
            state.vouchers.forEach(v => { if (v.status !== 'expired') total += v.amount; if (v.status === 'used') usedAmt += v.amount; });
            document.getElementById('stat-total').textContent = `$${total}`; document.getElementById('stat-used').textContent = `$${usedAmt}`; document.getElementById('stat-remain').textContent = `$${total - usedAmt}`;

            const list = document.getElementById('all-vouchers-list');
            swipeState.openItemId = null;
            if (!state.vouchers.length) { list.innerHTML = '<div class="text-center py-10 font-bold text-gray-400">暫無紀錄</div>'; return; }

            const sorted = [...state.vouchers].sort((a, b) => {
                const o = { 'unused': 1, 'used': 2, 'expired': 2 };
                if (o[a.status] !== o[b.status]) return o[a.status] - o[b.status];
                return new Date(b.date) - new Date(a.date);
            });

            list.innerHTML = sorted.map(v => {
                let actionsHTML = v.status === 'used' ? `<button onclick="promptUnuse('${v.id}')" class="swipe-action-btn bg-amber-500"><svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>取消</button>` : '';
                actionsHTML += `<button onclick="promptDelete('${v.id}')" class="swipe-action-btn bg-red-500 rounded-r-xl"><svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>刪除</button>`;

                let cl = 'swipe-content flex justify-between items-center cursor-pointer ' + (viewSelectedIds.has(v.id) ? 'view-selected-highlight ' : '');
                let badge = '', aCl = 'text-gray-800 amt-text', pCl = 'text-gray-800 platform-text', bCl = `border-left: 6px solid ${getPlatformColor(v.platform)}`;
                
                if (v.status === 'unused') cl += 'bg-white';
                else if (v.status === 'used') { cl += 'status-used'; badge = '<span class="text-[10px] bg-white text-gray-500 px-2 py-0.5 rounded-full font-bold ml-2 shadow-sm">✓ 已使用</span>'; pCl = 'text-gray-500 platform-text'; }
                else { cl += 'status-expired'; badge = '<span class="text-[10px] bg-white text-gray-400 px-2 py-0.5 rounded-full font-bold ml-2 shadow-sm">💸 失效</span>'; aCl = 'text-gray-400 line-through amt-text'; pCl = 'text-gray-400 platform-text'; bCl = 'border-left: 6px solid #cbd5e1'; }

                return `
                <div class="swipe-item-container shadow-sm border border-gray-200">
                    <div class="swipe-actions">${actionsHTML}</div>
                    <div class="${cl}" data-id="${v.id}" style="${bCl}" ontouchstart="handleTouchStart(event, '${v.id}')" ontouchmove="handleTouchMove(event)" ontouchend="handleTouchEnd(event)" onclick="handleViewItemTap('${v.id}')">
                        <div class="pointer-events-none">
                            <div class="flex items-center"><span class="font-bold text-lg ${pCl}">${v.platform}</span>${badge}</div>
                            <p class="text-[10px] text-gray-400 font-bold uppercase mt-1 tracking-wider">${v.roundLabel}</p>
                        </div>
                        <div class="font-black text-2xl pointer-events-none ${aCl}">$${v.amount}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function populateUseBankFilter() {
            document.getElementById('use-bank-filter').innerHTML = '<option value="all">全部</option>' + state.platforms.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
        }

        function renderUnusedVouchers() {
            const list = document.getElementById('unused-vouchers-list');
            const fBank = document.getElementById('use-bank-filter').value;
            const sortMode = document.getElementById('use-sort-filter').value;
            
            let unused = state.vouchers.filter(v => v.status === 'unused');
            if (fBank !== 'all') unused = unused.filter(v => v.platform === fBank);
            if (sortMode === 'amount') unused.sort((a, b) => b.amount - a.amount);
            else if (sortMode === 'amountAsc') unused.sort((a, b) => a.amount - b.amount);
            else unused.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (!unused.length) { list.innerHTML = '<div class="text-center py-10 font-bold text-gray-400">無未用券</div>'; return; }

            list.innerHTML = unused.map(v => `
                <div class="use-item bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center active:scale-95 transition-all cursor-pointer" data-id="${v.id}" style="border-left: 6px solid ${getPlatformColor(v.platform)}" onclick="markAsUsed('${v.id}')">
                    <div><span class="font-bold text-lg text-gray-800">${v.platform}</span><p class="text-[10px] font-bold tracking-wider text-gray-400 mt-1">${v.roundLabel}</p></div>
                    <div class="font-black text-2xl text-amber-500">$${v.amount}</div>
                </div>`).join('');
        }

        function markAsUsed(id) {
            openModal({ title: "確認使用？", desc: "標記後將移至已使用列表。", iconType: "warning", confirmBtnText: "使用", confirmBtnClass: "bg-amber-500", onConfirm: () => { const v = state.vouchers.find(v => v.id === id); if (v) v.status = 'used'; saveData(); renderUnusedVouchers(); showToast("已使用！"); } });
        }

        function openCalcModal() {
            document.getElementById('calc-input').value = '';
            document.getElementById('calc-modal').classList.add('modal-active');
            document.getElementById('calc-modal-box').classList.add('modal-box-active');
        }
        function closeCalcModal() {
            document.getElementById('calc-modal').classList.remove('modal-active');
            document.getElementById('calc-modal-box').classList.remove('modal-box-active');
        }

        function calculateAndHighlight() {
            const spend = parseFloat(document.getElementById('calc-input').value);
            if (isNaN(spend) || spend <= 0) { showToast("請輸入有效金額", "error"); return; }
            closeCalcModal();
            
            const maxCap = Math.floor(spend / 3);
            let available = state.vouchers.filter(v => v.status === 'unused');
            const fBank = document.getElementById('use-bank-filter').value;
            if (fBank !== 'all') available = available.filter(v => v.platform === fBank);

            if (!available.length) { showToast("無券可用", "error"); return; }
            document.querySelectorAll('.use-item').forEach(el => el.classList.remove('suggested-highlight'));

            let n = available.length, dp = Array(maxCap + 1).fill(0), keep = Array(n).fill(0).map(() => Array(maxCap + 1).fill(false));
            for (let i = 0; i < n; i++) {
                let v = available[i].amount;
                for (let w = maxCap; w >= v; w--) {
                    if (dp[w - v] + v > dp[w]) { dp[w] = dp[w - v] + v; keep[i][w] = true; }
                }
            }

            let bestSum = dp[maxCap];
            if (bestSum === 0) { showToast(`消費太少！最少要買 $${Math.min(...available.map(v=>v.amount))*3}`, "error"); return; }

            let currW = maxCap, selectedIds = [];
            for (let i = n - 1; i >= 0; i--) { if (keep[i][currW]) { selectedIds.push(available[i].id); currW -= available[i].amount; } }
            selectedIds.forEach(id => { const el = document.querySelector(`.use-item[data-id="${id}"]`); if (el) el.classList.add('suggested-highlight'); });
            showToast(`最抵組合：扣 $${bestSum}！`, "success");
        }

        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
