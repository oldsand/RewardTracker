<!DOCTYPE html>

<meta charset="UTF-8">

<style>
  :root {
    --primary: #4CAF50;
    --secondary: #FF9800;
    --bg: #F0F8FF;
    --text: #333;
    --box-bg: #FFF;
    --option-bg: #E3F2FD;
    --option-border: #90CAF9;
    --option-selected-bg: #FFB74D;
    --option-selected-border: #F57C00;
  }
  body {
    font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', '微軟正黑體', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 15px;
    font-size: 20px;
    user-select: none;
  }
  h1 {
    text-align: center;
    color: var(--secondary);
    font-size: 28px;
    text-shadow: 2px 2px 0px #FFE0B2;
    margin-bottom: 10px;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 15px;
  }
  .tab-btn {
    background-color: #E0E0E0;
    border: none;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .tab-btn.active {
    background-color: var(--secondary);
    color: white;
    transform: scale(1.05);
  }
  .quiz-container {
    background: var(--box-bg);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    max-width: 800px;
    margin: 0 auto;
  }
  .question-item {
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 2px dashed #E0E0E0;
  }
  .question-text {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
    line-height: 1.5;
  }
  .options-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .mcq-option {
    background-color: var(--option-bg);
    border: 3px solid var(--option-border);
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 20px;
    font-weight: bold;
    color: #1565C0;
    cursor: pointer;
    transition: 0.2s;
    flex-grow: 1;
    text-align: center;
    min-width: 30%;
  }
  .mcq-option.selected {
    background-color: var(--option-selected-bg);
    border-color: var(--option-selected-border);
    color: #FFF;
    transform: scale(1.02);
  }
  .mcq-option.correct {
    background-color: #4CAF50 !important;
    border-color: #388E3C !important;
    color: white !important;
  }
  .mcq-option.wrong {
    background-color: #F44336 !important;
    border-color: #D32F2F !important;
    color: white !important;
  }
  .submit-btn {
    display: block;
    width: 100%;
    max-width: 250px;
    margin: 20px auto 10px;
    background-color: var(--primary);
    color: white;
    font-size: 24px;
    font-weight: bold;
    padding: 15px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 6px 0 #388E3C;
  }
  .submit-btn:active {
    transform: translateY(6px);
    box-shadow: none;
  }
  #score-display {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: #D32F2F;
    margin-top: 20px;
  }
  .feedback-icon {
    font-size: 24px;
    margin-left: 10px;
    vertical-align: middle;
  }
</style>
</head>

let currentTabIndex = 0;
let userAnswers = {}; 

function loadTab(index) {
  currentTabIndex = index;
  userAnswers = {}; 
  
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });

  const section = quizData[index];
  document.getElementById('part-title').innerHTML = section.title;
  document.getElementById('score-display').innerHTML = "";
  
  const container = document.getElementById('questions-area');
  container.innerHTML = '';

  section.questions.forEach((q, qIndex) => {
    let questionHTML = `<div class="question-item" id="q-${qIndex}">`;
    questionHTML += `<div class="question-text">${q.text} <span class="feedback-icon" id="icon-${qIndex}"></span></div>`;
    
    questionHTML += `<div class="options-container">`;
    q.options.forEach((opt, optIndex) => {
      questionHTML += `<div class="mcq-option" id="opt-${qIndex}-${optIndex}" onclick="selectOption(${qIndex}, ${optIndex})">${opt}</div>`;
    });
    questionHTML += `</div></div>`;
    
    container.innerHTML += questionHTML;
  });
}

function selectOption(qIndex, optIndex) {
  userAnswers[qIndex] = optIndex;
  
  const section = quizData[currentTabIndex];
  section.questions[qIndex].options.forEach((_, i) => {
    document.getElementById(`opt-${qIndex}-${i}`).classList.remove('selected', 'correct', 'wrong');
  });
  
  document.getElementById(`opt-${qIndex}-${optIndex}`).classList.add('selected');
}

function checkAnswers() {
  const section = quizData[currentTabIndex];
  let correctCount = 0;
  let totalQuestions = section.questions.length;

  section.questions.forEach((q, qIndex) => {
    const selectedIdx = userAnswers[qIndex];
    const correctIdx = q.ansIndex;
    const iconSpan = document.getElementById(`icon-${qIndex}`);

    q.options.forEach((_, i) => {
      const optDiv = document.getElementById(`opt-${qIndex}-${i}`);
      optDiv.classList.remove('correct', 'wrong');
    });

    if (selectedIdx === undefined) {
      iconSpan.innerHTML = "⚠️ (未作答)";
      iconSpan.style.color = "#FF9800";
    } else if (selectedIdx === correctIdx) {
      correctCount++;
      document.getElementById(`opt-${qIndex}-${selectedIdx}`).classList.add('correct');
      iconSpan.innerHTML = "✅";
    } else {
      document.getElementById(`opt-${qIndex}-${selectedIdx}`).classList.add('wrong');
      document.getElementById(`opt-${qIndex}-${correctIdx}`).classList.add('correct');
      iconSpan.innerHTML = "❌";
    }
  });
  
  const scoreDiv = document.getElementById('score-display');
  scoreDiv.innerHTML = `🌟 你的成績：${correctCount} / ${totalQuestions} 題 🌟`;
  if (correctCount === totalQuestions) {
    scoreDiv.style.color = "#4CAF50";
    scoreDiv.innerHTML += "<br>太棒了！全對！🎉";
  } else {
    scoreDiv.style.color = "#D32F2F";
  }
}

window.onload = () => loadTab(0);
</script>
