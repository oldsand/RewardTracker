<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>瑪塔創想 MatataBot 兒童編程模擬器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Noto Sans TC for playful, readable typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background-color: #F2F6FC;
      background-image: radial-gradient(#DCE6F5 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 3D Tactile Toy Block Styling */
    .toy-block {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.22), 0 6px 12px rgba(0, 0, 0, 0.08);
    }
    .toy-block:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.22);
    }

    /* Signature Orange Play Button */
    .play-btn-3d {
      background: linear-gradient(180deg, #FF8524 0%, #FF6200 100%);
      box-shadow: 0 6px 0 #C94900, 0 10px 20px rgba(255, 98, 0, 0.35);
      transition: all 0.12s ease;
    }
    .play-btn-3d:hover:not(:disabled) {
      filter: brightness(1.05);
    }
    .play-btn-3d:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #C94900, 0 4px 8px rgba(255, 98, 0, 0.3);
    }
    .play-btn-3d:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Command Tower Scanning Light Cone */
    @keyframes towerScan {
      0%, 100% { opacity: 0.25; transform: scaleX(0.92); }
      50% { opacity: 0.75; transform: scaleX(1.04); }
    }
    .scan-beam {
      animation: towerScan 0.7s infinite ease-in-out;
      transform-origin: top center;
    }

    /* Active Executing Block Glow */
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(255, 133, 36, 0.85); }
      70% { box-shadow: 0 0 0 10px rgba(255, 133, 36, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 133, 36, 0); }
    }
    .executing-slot {
      animation: pulseRing 0.9s infinite;
      border-color: #FF6B00 !important;
      background-color: #FFF4EB !important;
      transform: scale(1.05);
      z-index: 20;
    }

    /* Robot Smooth Movement & Dance Animation */
    .robot-wrapper {
      transition: left 0.42s cubic-bezier(0.25, 1, 0.5, 1), top 0.42s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .robot-rotator {
      transition: transform 0.38s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    @keyframes robotDance {
      0%, 100% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.15) rotate(-18deg); }
      40% { transform: scale(1.15) rotate(18deg); }
      60% { transform: scale(1.18) rotate(-14deg); }
      80% { transform: scale(1.12) rotate(14deg); }
    }
    .animate-dance {
      animation: robotDance 0.75s ease-in-out;
    }

    @keyframes robotBump {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-6px, -4px); }
      50% { transform: translate(6px, 4px); }
      75% { transform: translate(-4px, 2px); }
    }
    .animate-bump {
      animation: robotBump 0.35s ease-in-out;
    }

    /* Floating Star & Flag */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .float-item {
      animation: floatSlow 2.2s infinite ease-in-out;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 100;
    }

    /* Tablet Touch Optimizations */
    @media (min-width: 768px) {
      .toy-block {
        min-height: 54px;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800 overflow-x-hidden">

  <!-- Confetti Layer -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Top Navigation Header -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1440px] mx-auto px-4 md:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center shadow-md text-white font-black text-2xl">
          🤖
        </div>
        <div>
          <h1 class="text-lg md:text-2xl font-black tracking-tight text-slate-800 leading-tight">
            瑪塔創想 <span class="text-orange-500">MatataBot</span> 編程樂園
          </h1>
          <p class="text-xs text-slate-500 font-medium">10吋平板大屏版・多地域與天氣探險模擬器</p>
        </div>
      </div>

      <!-- Right Controls: Sound, Speed, Tutorial -->
      <div class="flex items-center gap-2.5">
        <button id="speed-btn" onclick="toggleSpeed()" class="px-3.5 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs md:text-sm font-bold flex items-center gap-1.5 transition" title="切換執行速度">
          <span id="speed-icon" class="text-base">🐇</span>
          <span id="speed-label" class="hidden sm:inline">正常速度</span>
        </button>

        <button id="sound-btn" onclick="toggleSound()" class="p-2.5 md:px-3.5 md:py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs md:text-sm font-bold flex items-center gap-1.5 transition" title="開關音效">
          <span id="sound-icon" class="text-base">🔊</span>
          <span class="hidden sm:inline">音效</span>
        </button>

        <button onclick="openHelpModal()" class="px-3.5 py-2.5 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs md:text-sm font-bold flex items-center gap-1.5 transition">
          <span class="text-base">💡</span>
          <span>天氣與玩法說明</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace: Optimized Side-by-Side Split for 10-inch Tablets (md:grid-cols-12) -->
  <main class="flex-1 max-w-[1440px] w-full mx-auto px-4 md:px-6 py-4 grid grid-cols-1 md:grid-cols-12 gap-5 items-start">

    <!-- LEFT COLUMN: Large Map Arena, Biomes & Weather (7 cols on tablet/desktop) -->
    <section class="md:col-span-7 flex flex-col gap-3.5">

      <!-- Level Selector Bar -->
      <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">選擇探險關卡或自由創作</span>
          <span id="par-badge" class="text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700">
            目標：到達紅旗
          </span>
        </div>
        <div id="level-pills" class="flex items-center gap-2 overflow-x-auto pb-1">
          <!-- Populated dynamically by JS -->
        </div>
      </div>

      <!-- Map Board Container -->
      <div class="bg-white rounded-3xl p-4 md:p-5 shadow-md border border-slate-200/80 flex flex-col items-center relative">
        <!-- Level Title, Biome & Weather Badges -->
        <div class="w-full flex flex-col gap-2.5 mb-3.5 pb-3 border-b border-slate-100">
          <div class="flex flex-wrap items-start justify-between gap-2">
            <div>
              <h2 id="level-title" class="text-lg md:text-2xl font-black text-slate-800">第 1 關：出發吧！小車</h2>
              <p id="level-desc" class="text-xs md:text-sm text-slate-500 font-medium mt-0.5">用「前進」積木讓瑪塔小車走到紅旗的位置。</p>
            </div>

            <!-- Biome & Weather Status Pills (Interactive in Free Mode!) -->
            <div class="flex items-center gap-2 shrink-0">
              <button id="biome-badge" onclick="cycleFreeBiome()" class="px-3 py-1.5 rounded-2xl text-xs md:text-sm font-black border-2 bg-emerald-50 border-emerald-200 text-emerald-800 flex items-center gap-1.5 transition" title="在自由模式點擊可切換地域">
                <span id="biome-icon">🌲</span>
                <span id="biome-name">奇幻森林</span>
              </button>

              <button id="weather-badge" onclick="cycleFreeWeather()" class="px-3 py-1.5 rounded-2xl text-xs md:text-sm font-black border-2 bg-sky-50 border-sky-200 text-sky-800 flex items-center gap-1.5 transition" title="在自由模式點擊可切換天氣">
                <span id="weather-icon">☀️</span>
                <span id="weather-name">晴空萬里</span>
              </button>
            </div>
          </div>

          <!-- Weather Effect Rule Strip -->
          <div id="weather-rule-strip" class="px-3 py-1.5 rounded-xl bg-amber-50/90 border border-amber-200/80 text-xs font-bold text-amber-900 flex items-center gap-1.5">
            <span>🌤️</span>
            <span id="weather-rule-text">晴朗天氣：路面乾爽，適合長途探險！</span>
          </div>

          <!-- Free Mode Tools (Pen & Map Editor) -->
          <div id="free-mode-controls" class="hidden flex-wrap items-center gap-2 pt-1">
            <button id="pen-toggle-btn" onclick="togglePenMode()" class="px-3.5 py-2 rounded-xl text-xs md:text-sm font-bold border-2 transition flex items-center gap-1.5 bg-slate-100 border-slate-200 text-slate-700">
              <span>🖍️</span>
              <span id="pen-status-text">畫筆：關</span>
            </button>
            <div id="pen-colors" class="hidden items-center gap-1.5 bg-slate-100 p-1.5 rounded-xl">
              <button onclick="setPenColor('#EF4444')" class="w-6 h-6 rounded-full bg-red-500 ring-2 ring-offset-1 ring-transparent hover:scale-110 transition" data-color="#EF4444"></button>
              <button onclick="setPenColor('#3B82F6')" class="w-6 h-6 rounded-full bg-blue-500 ring-2 ring-offset-1 ring-transparent hover:scale-110 transition" data-color="#3B82F6"></button>
              <button onclick="setPenColor('#10B981')" class="w-6 h-6 rounded-full bg-emerald-500 ring-2 ring-offset-1 ring-transparent hover:scale-110 transition" data-color="#10B981"></button>
              <button onclick="setPenColor('#A855F7')" class="w-6 h-6 rounded-full bg-purple-500 ring-2 ring-offset-1 ring-transparent hover:scale-110 transition" data-color="#A855F7"></button>
            </div>
            <button onclick="clearDrawing()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs md:text-sm font-bold transition" title="清除畫線">
              擦掉畫線
            </button>
            <span class="text-xs text-slate-400 font-bold ml-auto">💡 點擊地域/天氣按鈕或地圖格子可自由佈置！</span>
          </div>
        </div>

        <!-- Enlarged Square Grid Arena for 10-inch Tablet -->
        <div id="arena-frame" class="w-full max-w-[540px] aspect-square relative rounded-3xl overflow-hidden border-4 border-emerald-300 bg-[#EBF7E3] shadow-inner transition-colors duration-500">
          <!-- Grid Cells Layer -->
          <div id="map-grid" class="w-full h-full grid"></div>

          <!-- SVG Pen Drawing Layer (For Geometry Drawing Mode) -->
          <svg id="pen-svg-layer" viewBox="0 0 100 100" class="absolute inset-0 w-full h-full pointer-events-none z-10"></svg>

          <!-- Dynamic Weather Particle Overlay Canvas -->
          <canvas id="weather-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-15"></canvas>

          <!-- MatataBot Character Layer -->
          <div id="matatabot" class="robot-wrapper absolute z-20 flex items-center justify-center pointer-events-none" style="width: 20%; height: 20%; left: 0%; top: 0%;">
            <div id="matatabot-rotator" class="robot-rotator w-[84%] h-[84%] flex items-center justify-center relative">
              <!-- Custom Inline SVG of MatataBot (White Robot with Yellow Dome & Clear Direction Arrow) -->
              <svg viewBox="0 0 120 120" class="w-full h-full drop-shadow-md">
                <!-- Direction Pointer Nose (Top = Forward) -->
                <polygon points="60,2 48,18 72,18" fill="#FF6B00" />
                <!-- Left & Right Wheels -->
                <rect x="10" y="34" width="12" height="52" rx="5" fill="#334155" />
                <rect x="98" y="34" width="12" height="52" rx="5" fill="#334155" />
                <!-- Wheel Treads -->
                <line x1="10" y1="46" x2="22" y2="46" stroke="#64748B" stroke-width="3" />
                <line x1="10" y1="60" x2="22" y2="60" stroke="#64748B" stroke-width="3" />
                <line x1="10" y1="74" x2="22" y2="74" stroke="#64748B" stroke-width="3" />
                <line x1="98" y1="46" x2="110" y2="46" stroke="#64748B" stroke-width="3" />
                <line x1="98" y1="60" x2="110" y2="60" stroke="#64748B" stroke-width="3" />
                <line x1="98" y1="74" x2="110" y2="74" stroke="#64748B" stroke-width="3" />

                <!-- White Robot Body -->
                <rect x="20" y="20" width="80" height="80" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
                <!-- Front Orange Bumper Accent -->
                <path d="M 38 20 L 82 20" stroke="#FF6B00" stroke-width="6" stroke-linecap="round" />

                <!-- Signature Yellow Translucent Dome -->
                <circle cx="60" cy="62" r="30" fill="#FACC15" stroke="#EAB308" stroke-width="3" />
                <!-- Dome Glossy Highlight -->
                <path d="M 43 46 A 22 22 0 0 1 72 42" fill="none" stroke="#FEF9C3" stroke-width="4" stroke-linecap="round" />

                <!-- Cute Robot Eyes facing forward (upwards in local space) -->
                <g id="robot-eyes-normal">
                  <circle cx="49" cy="48" r="4.5" fill="#1E293B" />
                  <circle cx="71" cy="48" r="4.5" fill="#1E293B" />
                  <circle cx="50.5" cy="46.5" r="1.5" fill="#FFFFFF" />
                  <circle cx="72.5" cy="46.5" r="1.5" fill="#FFFFFF" />
                </g>
                <g id="robot-eyes-happy" class="hidden">
                  <path d="M 44 50 Q 49 43 54 50" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />
                  <path d="M 66 50 Q 71 43 76 50" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />
                </g>
              </svg>
            </div>
          </div>
        </div>

        <!-- Live Execution / Debug Status Bar -->
        <div id="status-banner" class="w-full mt-3.5 px-4 py-3 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-between gap-2 text-xs md:text-sm font-bold text-slate-700">
          <div class="flex items-center gap-2">
            <span id="status-icon" class="text-lg">🤖</span>
            <span id="status-text">請在右邊控制板放上積木，再按橙色「執行」鍵！</span>
          </div>
          <button onclick="resetRobotOnly()" class="shrink-0 px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 border border-slate-300 text-slate-600 text-xs md:text-sm font-bold shadow-xs transition">
            ↺ 小車回起點
          </button>
        </div>
      </div>
    </section>

    <!-- RIGHT COLUMN: Command Tower, 16-Slot Control Board & Coding Blocks (5 cols on tablet/desktop) -->
    <section class="md:col-span-5 flex flex-col gap-3.5">

      <!-- Command Tower + White Control Board Assembly -->
      <div class="bg-white rounded-3xl p-4 shadow-md border border-slate-200/80 relative overflow-hidden">

        <!-- Command Tower Visual Header -->
        <div class="flex items-center justify-between bg-slate-50 rounded-2xl p-3 mb-3 border border-slate-200/70 relative">
          <div class="flex items-center gap-3">
            <!-- Mini Command Tower Graphic -->
            <div class="relative w-12 h-13 flex flex-col items-center justify-end">
              <!-- Orange Cap -->
              <div class="w-11 h-4 bg-gradient-to-r from-orange-500 to-orange-400 rounded-t-full shadow-xs z-10"></div>
              <!-- Camera Eye -->
              <div class="w-9 h-3.5 bg-slate-800 flex items-center justify-center z-10">
                <div id="tower-led" class="w-2.5 h-2.5 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8] transition-colors"></div>
              </div>
              <!-- White Tower Neck -->
              <div class="w-8 h-5 bg-white border-x border-slate-300 z-10"></div>
              <!-- Scanning Light Cone (Visible when running) -->
              <div id="tower-scan-beam" class="hidden scan-beam absolute top-8 w-48 h-40 bg-gradient-to-b from-orange-400/35 via-amber-300/15 to-transparent pointer-events-none z-0" style="clip-path: polygon(35% 0%, 65% 0%, 100% 100%, 0% 100%);"></div>
            </div>

            <div>
              <div class="flex items-center gap-2">
                <span class="font-black text-base md:text-lg text-slate-800">指令塔與控制板</span>
                <span id="block-counter" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-700">0 / 16 塊</span>
              </div>
              <p id="tower-status" class="text-xs text-slate-500 font-medium">藍燈常亮：已連接小車，由上至下、左至右執行</p>
            </div>
          </div>

          <!-- Clear Board Button -->
          <button onclick="clearBoard()" id="clear-btn" class="px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs md:text-sm font-bold transition shrink-0">
            🗑️ 清空
          </button>
        </div>

        <!-- 4x4 Control Board Grid (16 Slots for longer tablet paths!) -->
        <div id="control-board" class="grid grid-cols-4 gap-2 md:gap-2.5 p-2.5 bg-slate-100/90 rounded-2xl border-2 border-slate-200 relative z-10">
          <!-- 16 slots injected by JS -->
        </div>

        <!-- Big Orange Play Button Row -->
        <div class="mt-3.5 flex items-center gap-2.5">
          <button id="play-btn" onclick="runProgram()" class="play-btn-3d flex-1 py-3.5 px-5 rounded-2xl text-white font-black text-lg md:text-xl tracking-wide flex items-center justify-center gap-2.5">
            <svg viewBox="0 0 24 24" class="w-6 h-6 fill-current">
              <polygon points="6,4 20,12 6,20" />
            </svg>
            <span>執行程式 (Play)</span>
          </button>

          <button id="stop-btn" onclick="stopProgram()" class="hidden py-3.5 px-5 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-black text-lg shadow-md flex items-center justify-center gap-1.5 transition">
            <span>⏹️</span>
            <span>停止</span>
          </button>
        </div>
      </div>

      <!-- Coding Blocks Drawer (Palette) -->
      <div class="bg-white rounded-3xl p-4 shadow-md border border-slate-200/80">
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-sm md:text-base font-black text-slate-700">🧩 點擊或拖拉積木到控制板：</span>
          <span class="text-xs text-slate-400 font-medium">數字可疊加在指令下方</span>
        </div>

        <!-- Category 1: Motion Blocks (Green) -->
        <div class="mb-3">
          <div class="text-xs font-bold text-emerald-700 mb-1.5 flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 移動方向積木
          </div>
          <div class="grid grid-cols-4 gap-2.5">
            <button onclick="handlePaletteClick('forward')" draggable="true" ondragstart="handlePaletteDragStart(event, 'forward')"
              class="toy-block rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-white py-2.5 px-1 flex flex-col items-center justify-center gap-1 cursor-pointer">
              <span class="text-xl md:text-2xl font-black leading-none">⬆️</span>
              <span class="text-xs md:text-sm font-black">前進</span>
            </button>

            <button onclick="handlePaletteClick('backward')" draggable="true" ondragstart="handlePaletteDragStart(event, 'backward')"
              class="toy-block rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-white py-2.5 px-1 flex flex-col items-center justify-center gap
